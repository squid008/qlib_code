# 自动依赖升级（★ v2.10.51 引入；v2.10.52 收紧；★★ v2.11.98 **降噪**）
#
# ## v2.10.52 为什么收紧（真实教训 ✓）
# 首次启用后 dependabot 一次开了 14 个 PR，大半是 major：
#   recharts 2.15 → 3.10 ｜ typescript 5.9 → 7.0 ｜ vite 5.4 → 8.3 ｜ actions/checkout 4 → 7
# ⇒ 这些 PR 的 CI 几乎全红 ⇒ 邮件一堆、红灯一片、还把"main 是绿的"这个信号污染掉 ✗。
#
# ## ★★ v2.11.98 为什么再降噪（2026-10-26 的教训 ✓）
# 用户收到 **75 封 dependabot 邮件**。三条原因叠加：
#   ① `schedule.interval: weekly` + `day: monday` ⇒ **周一集中触发**，三个 ecosystem 同时开 PR；
#   ② `open-pull-requests-limit: 2` × 3 个 ecosystem ⇒ 最多 6 个 PR；
#   ③ `.github/CODEOWNERS` 里 `*  @squid008` ⇒ **每个 PR 都自动请求 review**，
#      而每个 PR 还会发「开PR / 请求review / 打标签×2 / 评论」等好几条事件 ✓
#      ⇒ 3 个 PR 就能变成几十封邮件 ✓。
#
# ⇒ 现在（**安静优先**）：
#   · **`groups`**：把 minor+patch **合进同一个 PR** ✓（3 个 PR → **1 个 PR** ✓）；
#   · `open-pull-requests-limit: 1` ✓（配合 groups，一个 ecosystem 同时只挂 1 个 ✓）；
#   · `interval: monthly` ✓（不再每周一固定轰炸；要更勤可以人工触发 ✓）；
#   · `rebase-strategy: disabled` ✓（避免 bot 反复 rebase 产生"已更新"事件 ✓）；
#   · **major 一律不自动提** ✓（要连带改代码 + 改 `constraints.txt` + 跑引擎指纹 ✓）。
#
# ⚠ 若要**彻底静音**：GitHub → Settings → Notifications 里把 Watching 调成
#   「Participating and @mentions」，或直接把本文件删掉（改为人工季度升级）✓。
#
# ⚠ 本项目的特殊性：`backend/constraints.txt` 是**全 `==` 锁定** ✓
#   ⇒ dependabot 只会动 `requirements.txt` ✗ ⇒ **合 PR 前必须人工补 constraints** ✓，
#   否则本地/CI 装的还是旧版本 ⇒ "升了等于没升" ✗。

version: 2

updates:
  # ---- 后端：运行时与开发依赖 ----
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    # ★ 一个 PR 收全部 minor+patch ✓（原来是每个依赖一个 PR ✗）
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # ⚠ qlib 是**上游源码安装**（`pip install -e`）✓，不在本文件管辖 ✓

  # ---- 前端 ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # vitest **必须与 `@vitest/coverage-v8` 同版本** ✓（不一致时覆盖率插件直接不工作 ✗）
      # ⇒ 连 minor 也不自动提 ✓，交给人工同批升级 ✓
      - dependency-name: vitest
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # ---- CI 里用到的 action（供应链里最容易被忽略的一段 ✗）----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # action 的 major 往往是"v4 → v7"这种跨代 ✓（如 checkout 4→7）⇒ 人工评估 ✓
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
