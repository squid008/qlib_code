# 夜间 job（★ v2.11.54）—— 专跑**真实链路**，不进 PR 的 CI（PR 要快 ✗）。
#
# 为什么单独一个 workflow 而不是加进 ci.yml：
#   ci.yml 的 `on:` 是 push / pull_request ✓。若在里面加 `schedule`，
#   那一整套 6 个 job（装 numpy/lightgbm/qlib/Chromium，约 3 分钟 × 6）都会每天重跑一遍 ✗。
#   ⇒ 单独文件，只跑这两件事 ✓。
#
# 两件事（都是外部评审点名的"闸门管不到的地方"）：
#   ① `datareq` 真实数据链路：合成数据上**16 条必然失败**（缺物化 chip_* / 真复权因子 / 真标的），
#      ⇒ 用"**已知失败清单**"比对 ✓：出现清单外的失败才算红 ✓（真回归），
#        失败比清单少则提示收窄 ✓。**不做** `pytest -m datareq` 直接跑 —— 那会永远红 ✗，
#        几天后就没人看了 ✓（比不跑更糟 ✗）。
#   ② **真后端 E2E**：`frontend/playwright.real.config.ts`（一条 `page.route` 都没有 ✓）——
#      现有 7 条 E2E 把 `/api/**` 全 stub 掉 ✗ ⇒ "前后端联调通没通"从来没被自动化验过 ✗。
name: 夜间（真实链路）

on:
  schedule:
    # UTC 18:00 = 北京 02:00 ✓（凌晨跑，不占白天）
    - cron: '0 18 * * *'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: backend

jobs:
  real-links:
    name: datareq 看门狗 + 真后端 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # ⚠ 必须 FORCE：本机/CI 若有 `data/active_dataset.json`，它会**压过环境变量** ✗
      QLIB_PROVIDER_URI_FORCE: '1'
      QLIB_PROVIDER_URI: ${{ github.workspace }}/data/_synth_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: 安装后端依赖 + qlib（与 ci.yml 同一套锁）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          git clone --depth 1 https://github.com/microsoft/qlib "$HOME/qlib"
          # ★ v2.11.52 起锁 commit sha ✓（不锁 ⇒ 上游一变就红，且红成"测试莫名失败"✗）
          git -C "$HOME/qlib" fetch -q --depth 1 origin 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          git -C "$HOME/qlib" checkout -q FETCH_HEAD
          pip install -e "$HOME/qlib"

      - name: 生成合成 qlib 数据（用 qlib 自己的读取器校验格式）
        working-directory: .
        run: python scripts/make_synth_qlib.py --out data/_synth_ci --verify

      - name: ⓪ 下载真实数据夹具（让 datareq 真跑，而不是整片 skip）
        # ★ v2.11.70：那 15 条 skip 的根因是"CI 里没有真数据"✗ ——
        #   它们要的正是**真数据特有的性质**（真涨跌停 / 真停牌 / 真复权因子 / 长假 ✓）。
        #   夹具 = 从真 `cn_data` 抽的 **183 只 × 668 天**（zip 5.2MB ✓ 走 **release asset** ✓
        #   不塞仓库、不脏历史 ✓），生成方式见 `scripts/make_real_fixture.py` ✓。
        #   实测（同一批用例）：合成数据 `6 passed / 16 skipped` → 夹具 **`26 passed / 2 skipped`** ✓。
        # ⚠ 下载失败必须**明确报错** ✗ —— 否则会静默回到"全 skip"状态 ✓：看着绿，其实什么都没测 ✗。
        working-directory: .
        run: |
          curl -sSfL -o /tmp/real_fixture.zip \
            https://github.com/${{ github.repository }}/releases/download/data-fixture-v1/real_fixture.zip
          mkdir -p data/_real_fixture
          unzip -q -o /tmp/real_fixture.zip -d data/_real_fixture
          test -f data/_real_fixture/_real_fixture.json || { echo "夹具缺指纹 ✗"; exit 1; }
          echo "QLIB_PROVIDER_URI=$PWD/data/_real_fixture" >> "$GITHUB_ENV"
          echo "QLIB_PROVIDER_URI_FORCE=1" >> "$GITHUB_ENV"
          echo "夹具就绪：$(ls data/_real_fixture/features | wc -l) 只"

      - name: ① datareq 看门狗（允许已知失败，禁止悄悄多失败）
        # ⚠⚠ `working-directory: .` **不能省** ✗→✓ —— job 级有
        #   `defaults.run.working-directory: backend`（给安装/pytest 用的）✓，
        #   这里若继承它 ⇒ 路径变成 `backend/scripts/check_datareq_baseline.py` ✗
        #   ⇒ 实测第一次触发就红：`can't open file .../backend/scripts/check_datareq_baseline.py` ✓。
        #   （脚本内部会自己把 cwd 切到 backend 跑 pytest ✓，所以这里只要站在仓库根 ✓。）
        working-directory: .
        run: python scripts/check_datareq_baseline.py --pytest-args "-m datareq"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端依赖 + Chromium
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: ② 真后端 E2E（不 mock 任何 /api/*）
        working-directory: frontend
        env:
          # playwright.real.config.ts 用它起 uvicorn ✓（ubuntu 上是 python3）
          PYTHON: python3
        run: npm run test:e2e:real

      - name: 失败上传截图与 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
