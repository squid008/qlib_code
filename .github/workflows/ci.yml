# CI：pytest + 后端 ruff + 前端 tsc --noEmit 作为提交 gate。
#
# 说明：
# - 数据（cn_data / moneyflow）不在仓库，后端测试只跑纯逻辑子集
#   （`-m "not datareq"`；datareq 用例需真实数据，在本地用 scripts/check.ps1 跑）。
# - qlib 以源码方式安装（pip install -e <上游 main>），与本机开发版同源；
#   若上游 API 漂移导致测试红，说明依赖版本需要锁定/复查，见 md/开发记录.md。
# - 本地离线等价物：scripts/check.ps1（可 -SkipData）。

name: CI

# ★ v2.10.57（2026-10-21 ✓）：**同一分支只留最新一次 run** ✗→✓
#   没有这段时：连着推 3 次 ⇒ 3 条 CI **同时跑** ✓（每个都要装 numpy/lightgbm/Chromium ✗），
#   而且旧的那两条**结论已经没意义**✓（代码都换了两版 ✓），却仍占并发、仍会发失败邮件 ✗。
#   ⚠ 用 `head_ref` 做 key ✓：PR 上按**分支名**区分 ✓，推 main 时按 `ref` ✓ ——
#     两者都不能省 ✗（只写 `github.ref` 时，同一 PR 的多次推送会互相取消错对象 ✓）。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装 Python 依赖 + qlib（上游源码）
        # ★ v2.10.23（2026-10-20 ✓）：**从"裸装"改成"声明 + 锁定"** ✗→✓
        #   原来是一串 `pip install numpy scipy pandas ...`（**没有版本** ✗）
        #   ⇒ 上游一升级，CI 会先红在"某个测试莫名其妙失败"✗，而不是"依赖不对"✗（排查成本极高 ✓）。
        #   现在：`requirements.txt`（声明）+ `requirements-dev.txt`（测试/检查工具）
        #        + `-c constraints.txt`（**精确版本** ✓，由本机实测通过的版本导出 ✓）。
        #   ⚠ 升级依赖请**单独一个 commit 只改 constraints.txt** ✓
        #     ⇒ "哪次升级导致变红"一眼可见 ✓。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          git clone --depth 1 https://github.com/microsoft/qlib "$HOME/qlib"
          # qlib 上游源码是**已知的不可控项** ✓（它自己会拉依赖 ✓），故不锁 ✓
          pip install -e "$HOME/qlib"

      - name: 依赖漏洞扫描（pip-audit）
        # ★ v2.10.23 新增 ✓：只扫**我们声明的直接依赖** ✓（`-r requirements.txt` ✓）
        #   挡住"带已知 CVE 的版本一路绿灯上线"✗ —— 这类问题不会让任何测试变红 ✓。
        # ⚠ 扫出来的修法：**只改 `constraints.txt` 升到已修版本** ✓（单独 commit ✓），
        #   不要在 CI 里加 `--ignore-vuln` 糊过去 ✗。
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: mypy 类型检查（★ 关键切片，v2.10.4）
        # ★ 2026-10-20：第二件事「类型检查」的第一道闸 ✓
        #   · 只查 `app/models` + `app/config.py` + `app/engine/metrics.py` ✓
        #     （切片与理由写在 `backend/pyproject.toml` 的 `[tool.mypy]` 注释里 ✓）
        #   · **必须带 pydantic 插件** ✗→✓：不带时 `BacktestResult()` 会被报 12 条
        #     `Missing named argument` 假阳性 ✗（插件在配置里 ✓，这里不用重复指定 ✓）
        #   · 要求 **0 错误** ✓ —— 先把它做成"如实失败"的闸门 ✓，再往周边扩 ✓
        run: python -m mypy

      - name: pytest + 覆盖率（纯逻辑；datareq 无数据自动跳过）
        # ★★ v2.10.18（2026-10-20 ✓）：**修一个从 v2.9.6 起就静默失效的闸门** ✗→✓
        #   原来写的是 `run: >-` + **块内的 `#` 说明行** ✓ —— 这是 YAML **折叠块标量** ✓，
        #   块里的 `#` **不是 YAML 注释** ✗ 而是**内容** ✓；折叠成一行交给 bash 后，
        #   bash 把 `#` 之后**全当注释** ✓ ⇒ 实际只执行了
        #       python -m pytest tests -m "not datareq" -q
        #   ⇒ `--cov` / `--cov-report` / `--cov-fail-under` **从未生效** ✗✗
        #   ⇒ 覆盖率门槛**形同虚设** ✓；也解释了"CI 日志里从来看不到 TOTAL"✗ —— 压根没开覆盖率 ✓。
        #   ⇒ 现改成**单行 run** ✓；一切说明文字留在**YAML 注释**里（就是本段 ✓）。
        #
        # 门槛口径（保留历史，供下次调数字时对照 ✓）：
        #   · v2.9.6 起设门槛（54）✓；v2.9.55 → 55 ✓；v2.9.88 → 56 ✓；v2.10.17 → 60 ✓
        #   · **v2.10.19 → 61** ✓ —— 依据：闸门修好后**第一次读到 CI 自己的数字**
        #     `TOTAL 18996 7363 61.24%`（1543 passed / 4 skipped ✓）⇒ 按口径取整 = **61** ✓。
        #   · 规则：**门槛 = 实测值向下取整** ✓，且优先用 **CI 实测** ✓（本地 61.50 / CI 61.24 ✓
        #     —— 两者差 0.26pp ✓，说明过去"CI 略高"的说法**不总成立** ✗ ⇒ 只认 CI 数 ✓）；
        #   · 改这个数字必须同时写进 `md/change_log.md` ✓（否则下一个人不知道为什么是 61 ✗）；
        #   · 若 CPython/依赖版本变化导致掉点，先看日志里的 `TOTAL` ✓（现在会真的打印 ✓）再决定调不调 ✓。
        # ★ v2.10.98：**64 → 65** ✓（本地全量实测 **66.07%** / 1833 passed ✓；
        #   CI 历来比本地低 0.2~0.3pp ⇒ 预计 CI 约 65.8% ✓，余量 ~0.8pp ✓
        #   ⚠ 不敢直接上 66 ✗ —— 那需要 CI 实测 ≥66.0 ✓，而历史差值说明会擦线 ✗）
        run: python -m pytest tests -m "not datareq" -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=65

      - name: ruff 静态检查
        run: python -m ruff check app tests tools

  frontend:
    name: 前端 tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★★ v2.9.40（2026-10-19 ✓）：20 → **22** ✗→✓
          #   为什么：2.9.21 查清 CI（Linux + Node 20）上**只要走 jsdom 就崩** ✗
          #   （`TypeError: ... (reading 'bind')` ✓、0 个用例被收集 ✓），而本地
          #   **Node 24** 正常 ✓ ⇒ 高度怀疑 Node 版本与 jsdom 30 不兼容 ✗。
          #   ⇒ 升到 **22（LTS）** ✓，并用 `src/__tests__/dom_probe.test.tsx`（逐文件开 jsdom ✓）
          #     当探针验证 ✓ —— 探针绿 = jsdom 可用 = 可以开始写**交互级**组件测试 ✓。
          #   ⚠ 若探针仍红 ✗：说明光升 Node 不够 ⇒ 钉 jsdom 版本或换 `happy-dom` ✓
          #     （**不要**再动全局 `environment` ✗ —— 它是 `node`，纯函数用例跑得更快 ✓）。
          node-version: 22
          # ★ v2.10.57：**补上 npm 缓存** ✓（e2e job 早就有 ✓，这个 job 漏了 ✗）
          #   `npm install --legacy-peer-deps` 每次都从零拉 ~300 个包 ⇒ 白等 40~60 秒 ✓。
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # ★★ v2.9.19（2026-10-18 ✓）：`npm ci` → `npm install --legacy-peer-deps` ✗→✓
        #   为什么必须改：CI 从 2.9.17 起**一直是红的** ✗ —— 报的是 npm 的**用法错误**
        #   （`npm error Usage: npm ci` + 一大串 options ✓），真因是：
        #     · 本仓库的 lockfile 是带 `--legacy-peer-deps` 生成的 ✓
        #       （`@testing-library/react@16` 对 React 有 peer 声明 ✗，不加就 ERESOLVE ✓）；
        #     · 而 `npm ci` 会**重新校验 peer** ✗ ⇒ 直接 `EUSAGE` 退出 ✓。
        #   代价：不再"严格复现 lockfile"✗ —— 但换来确定性（与本地同一套 flag ✓）✓。
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npx tsc --noEmit -p tsconfig.json

      # ★★ v2.11.24（2026-10-22 ✓）：**终于有前端 linter 了** ✓ —— 用 **biome** 而不是 eslint ✓
      #   为什么不是 eslint：`npm i -D eslint …` 在这台机器上反复装不上 ✗
      #   （本项目 eslint 这条债挂了很久 ✓）；**biome 是单二进制** ✓（`@biomejs/biome` ✓ 一次装上 ✓），
      #   不需要 eslint 那一堆 plugin/parser 组合 ✓。
      #   ⚠ 规则是**显式白名单**（`recommended: false` ✗ 不用推荐全集 ✓）：
      #     推荐全集在本仓报 **148 errors / 191 warnings** ✗（绝大多数是风格/import 扩展名 ✓），
      #     直接开会变成"上线即红"✗ 或"关掉大半"✗。现在只开**能抓真 bug** 的十余条 ✓：
      #     `noUnusedImports/Variables`（死代码 ✓）、`noSwitchDeclarations`、`noUnreachable`、
      #     `noDoubleEquals`、`noDuplicateObjectKeys`、`noAsyncPromiseExecutor`、`noSelfCompare`、
      #     `noFallthroughSwitchClause` ✓。
      #   ⚠ `useExhaustiveDependencies`（React hooks 依赖）**暂时关掉** ✗ —— 历史代码有几十处 ✓，
      #     修它要逐条确认"漏依赖是不是故意的"✓（另开一轮 ✓）；关它**不影响**本步的价值 ✓。
      - name: 前端 lint（biome）
        run: npm run lint

      # ★★ v2.11.41：**前端依赖漏洞闸门** ✓ —— 此前只有后端 `pip-audit` ✓，
      #   前端 **`package.json` 一堆依赖完全没审计过** ✗（供应链的另一半 ✓）。
      #   ⚠ 只卡 **critical** ✓：本仓生产依赖里 `xlsx`（SheetJS）有 **2 个 high 且「No fix available」**
      #     ✗ —— SheetJS 已不在 npm 维护 ✓ ⇒ 卡 high 就会"上线即红"✗，
      #     而那条**只能靠换库解决**（不在本轮范围 ✓，已记入技术债 ✓）。
      #   ⇒ 卡 critical 是"**能守住的那条线**" ✓：真出现 critical 必须当场停下 ✓。
      - name: 前端依赖漏洞（npm audit，只卡 critical）
        run: npm audit --omit=dev --audit-level=critical

      # ★ v2.9.17（2026-10-18 ✓）：**前端单测**接进 CI ✓
      #   首个用例集 = `sftLogic`（结论判定 / 预测周期解析 / K 档 / 导出表头 ✓ 11 条 ✓）。
      #   ⚠ vitest 版本要跟着 vite 走 ✗：项目 vite 5 ⇒ **vitest 2.1.x** ✓（5.x 会报
      #     `ERR_PACKAGE_PATH_NOT_EXPORTED ./module-runner` ✓，实测过 ✓）。
      - name: 前端单测 + 覆盖率（vitest）
        # ★ v2.10.23（2026-10-20 ✓）：`npm test` → `npm run test:cov` ✗→✓
        #   前端 181 条用例此前**完全不知道覆盖了哪些组件** ✗（后端有 61.83% + 门槛 ✓，
        #   前端是最后一块黑箱 ✓）⇒ 现在**采集并打印** ✓。
        # ⚠ 本轮**不设门槛** ✓（先拿真实数字 ✓，下一版按"实测值向下取整"设 thresholds ✓）——
        #   凭感觉设一个数，闸门要么一上线就红 ✗、要么松到没意义 ✗。
        run: npm run test:cov

  # ★ v2.11.27（技术债"无 SAST"清偿 ✓）：**代码安全扫描** —— 补上"只有依赖漏洞扫描（pip-audit）、
  #   没有源码级扫描"的缺口 ✓。
  #   ⚠ 只跑**中/高危**（`-ll` ✓）：全量跑在本仓噪声爆炸 ✗（本项目公式求值天然用 `eval` 类机制 ✓）。
  #   ⚠ 规则跳过写在 `backend/pyproject.toml` 的 `[tool.bandit]` ✓ ——
  #     **原因写在配置里**而不是散在各处的 `# nosec` ✓（分散的原因没人会读到 ✗）。
  #   实测：修完 10 处 md5/sha1 的 `usedforsecurity=False` 后 ⇒ **No issues identified** ✓。
  security-scan:
    name: 代码安全扫描（bandit）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装 bandit
        run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - name: bandit（只报中/高危）
        working-directory: backend
        run: python -m bandit -ll -r app -c pyproject.toml


  # ★ v2.10.5（2026-10-20 ✓）：三件事里的第 ③ 件 —— **E2E 冒烟骨架** ✓
  #
  # 为什么单开一个 job ✗→✓：
  #   · 要下 Chromium（`playwright install --with-deps` 约 1~2 分钟 ✓）✗ 不该拖慢单测 job ✓；
  #   · E2E 天生比单测**慢且更易受环境影响** ✓ ⇒ 单独失败时一眼看得出是"集成层"而不是"逻辑层" ✓。
  #
  # 断言范围（写在 `frontend/e2e/smoke.spec.ts` 文件头 ✓）：
  #   真实浏览器跑通整棵 React 树 ✓ + **零未捕获异常** ✓ + 顶栏版本号 ✓；
  #   ⚠ **不做**"提交回测 → 等结果"那条全链路 ✗（需要真后端 + 真数据 + 分钟级等待 ✓，下一轮 ✓）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★ v2.10.57（2026-10-21 ✗→✓）：**20 → 22**，与单测 job 对齐 ✓
          #   原来前端单测跑 **22** ✓、E2E 跑 **20** ✗ ⇒ **同一个前端跑在两个 Node 上** ✓
          #   ⇒ 会出现"单测过、e2e 挂"（或反之）这种最难查的偏差 ✗
          #   （Playwright 与 vite/vitest 的差异常常就藏在 runtime 版本里 ✓）。
          #   ⇒ 统一到 **22（LTS）** ✓ —— 单测那边升 22 是为了 jsdom，e2e 跟着走 ✓。
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        # 与 frontend job 同一套 flag ✓（否则 peer 依赖会让 lockfile 与安装结果不一致 ✗）
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 安装 Chromium（仅 chromium ✓，不下 firefox/webkit ✗）
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E 冒烟
        working-directory: frontend
        run: npm run test:e2e

      - name: 失败时上传 trace / 截图（只有失败才有 ✓）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # ★ v2.10.65（2026-10-21 ✓）：**密钥扫描**（技术债 P2-#7 已清偿 ✓）
  #
  # 为什么单开一个 job ✗→✓：
  #  · 它**不需要** Python/npm 环境 ✓ ⇒ 独立跑只要几秒 ✓（挂在 backend job 里会白白等
  #    numpy/lightgbm 装完才轮到它 ✗）；
  #  · 红的时候一眼看出是"**泄露**"而不是"测试挂了"✓ —— 这两件事的处置完全不同 ✓。
  #
  # 为什么值得有 ✓：`pip-audit` 管的是**依赖漏洞**（间接依赖被人投毒 ✓），
  #   而这里管的是**我们自己写进仓库的密钥/令牌** ✗ —— 那是"一旦发生就得**轮换**"的事 ✓，
  #   越晚发现越贵 ✓（且 `git rm` 之后**历史里还在** ✗）。
  #
  # ⚠ 首次接入前已本地做过启发式预扫（`sk-…` / `ghp_…` / `AKIA…` / `BEGIN … PRIVATE KEY` /
  #   `xxx_key = "<12+ 位>"` 五类）⇒ **零命中** ✓，所以这里**没有**预先加 allowlist ✓。
  #   ⚠ 若将来出现**误报**（如文档里写了个示例 token ✗）：请加**精确到文件+行**的 allowlist ✓，
  #     用 `--no-git` 或整仓 `paths` 忽略会把真泄露一起放过 ✗。
  secret-scan:
    name: 密钥扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史才能扫"过去的提交"✓（只扫工作区会漏掉"已提交过、后来删掉"的密钥 ✗）
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 个人账号免费 ✓；组织账号需要 GITLEAKS_LICENSE ✗（本仓库是个人 public ✓）
          GITLEAKS_ENABLE_SUMMARY: true

  # ★★ v2.11.42（2026-10-23 ✓）：**真实数据链路第一次进 CI** ✓
  #   背景：`backend/tests/` 里 21 处 `@pytest.mark.datareq`（复权/筹码/面板取数/端到端回测 ✓）
  #   在 CI 里**全部 skip** ✗ ⇒ 这条链**从来没有自动化** ✓（只能本机手工撞 ✓）；
  #   而本机真数据 **34 GB / 141 万文件** ✗ 不可能进 CI ✓。
  #   ⇒ 用 `scripts/make_synth_qlib.py` **现造**一份 30 只 × 4 年（约 2 MB）的合成 qlib bin ✓，
  #     并先跑 `--verify` 让 **qlib 自己的读取器**读回校验（格式对不对由它判定 ✓，不是我说了算 ✓）。
  #   ⚠ 只跑 `-m synthdata`（**11 条**实测能在合成数据上通过的 ✓）：
  #     另外 11 条要**真实数据特有的性质**（物化 chip_* bin / 真复权因子 / 万科那种真标的 ✓）
  #     ⇒ 仍留在 `datareq`，只能本机跑 ✓（原因写在各测试的 marker 旁 ✓，别硬凑 ✗）。
  synth-data:
    name: 真实数据链路（合成 qlib 数据）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖 + qlib（同 backend job）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          git clone --depth 1 https://github.com/microsoft/qlib "$HOME/qlib"
          pip install -e "$HOME/qlib"

      - name: 生成合成 qlib 数据（并用 qlib 读回校验格式）
        working-directory: .
        run: python scripts/make_synth_qlib.py --out data/_synth_ci --verify

      - name: pytest（真实数据链路，4 条）
        env:
          # ⚠ 本机可能有 `active_dataset.json` 占优先 ✓ ⇒ 必须 FORCE 才让环境变量生效 ✓
          QLIB_PROVIDER_URI_FORCE: "1"
          QLIB_PROVIDER_URI: ${{ github.workspace }}/data/_synth_ci
        run: python -m pytest tests -q -m synthdata

      # ⚠⚠ **临时诊断（v2.11.44，定位完就删）** —— P2-#23 最后那 2 条为何取 0 行。
