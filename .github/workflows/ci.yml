# CI：pytest + 后端 ruff + 前端 tsc --noEmit 作为提交 gate。
#
# 说明：
# - 数据（cn_data / moneyflow）不在仓库，后端测试只跑纯逻辑子集
#   （`-m "not datareq"`；datareq 用例需真实数据，在本地用 scripts/check.ps1 跑）。
# - qlib 以源码方式安装（pip install -e <上游 main>），与本机开发版同源；
#   若上游 API 漂移导致测试红，说明依赖版本需要锁定/复查，见 md/开发记录.md。
# - 本地离线等价物：scripts/check.ps1（可 -SkipData）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装 Python 依赖 + qlib（上游源码）
        # ★ v2.10.23（2026-10-20 ✓）：**从"裸装"改成"声明 + 锁定"** ✗→✓
        #   原来是一串 `pip install numpy scipy pandas ...`（**没有版本** ✗）
        #   ⇒ 上游一升级，CI 会先红在"某个测试莫名其妙失败"✗，而不是"依赖不对"✗（排查成本极高 ✓）。
        #   现在：`requirements.txt`（声明）+ `requirements-dev.txt`（测试/检查工具）
        #        + `-c constraints.txt`（**精确版本** ✓，由本机实测通过的版本导出 ✓）。
        #   ⚠ 升级依赖请**单独一个 commit 只改 constraints.txt** ✓
        #     ⇒ "哪次升级导致变红"一眼可见 ✓。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          git clone --depth 1 https://github.com/microsoft/qlib "$HOME/qlib"
          # qlib 上游源码是**已知的不可控项** ✓（它自己会拉依赖 ✓），故不锁 ✓
          pip install -e "$HOME/qlib"

      - name: 依赖漏洞扫描（pip-audit）
        # ★ v2.10.23 新增 ✓：只扫**我们声明的直接依赖** ✓（`-r requirements.txt` ✓）
        #   挡住"带已知 CVE 的版本一路绿灯上线"✗ —— 这类问题不会让任何测试变红 ✓。
        # ⚠ 扫出来的修法：**只改 `constraints.txt` 升到已修版本** ✓（单独 commit ✓），
        #   不要在 CI 里加 `--ignore-vuln` 糊过去 ✗。
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: mypy 类型检查（★ 关键切片，v2.10.4）
        # ★ 2026-10-20：第二件事「类型检查」的第一道闸 ✓
        #   · 只查 `app/models` + `app/config.py` + `app/engine/metrics.py` ✓
        #     （切片与理由写在 `backend/pyproject.toml` 的 `[tool.mypy]` 注释里 ✓）
        #   · **必须带 pydantic 插件** ✗→✓：不带时 `BacktestResult()` 会被报 12 条
        #     `Missing named argument` 假阳性 ✗（插件在配置里 ✓，这里不用重复指定 ✓）
        #   · 要求 **0 错误** ✓ —— 先把它做成"如实失败"的闸门 ✓，再往周边扩 ✓
        run: python -m mypy

      - name: pytest + 覆盖率（纯逻辑；datareq 无数据自动跳过）
        # ★★ v2.10.18（2026-10-20 ✓）：**修一个从 v2.9.6 起就静默失效的闸门** ✗→✓
        #   原来写的是 `run: >-` + **块内的 `#` 说明行** ✓ —— 这是 YAML **折叠块标量** ✓，
        #   块里的 `#` **不是 YAML 注释** ✗ 而是**内容** ✓；折叠成一行交给 bash 后，
        #   bash 把 `#` 之后**全当注释** ✓ ⇒ 实际只执行了
        #       python -m pytest tests -m "not datareq" -q
        #   ⇒ `--cov` / `--cov-report` / `--cov-fail-under` **从未生效** ✗✗
        #   ⇒ 覆盖率门槛**形同虚设** ✓；也解释了"CI 日志里从来看不到 TOTAL"✗ —— 压根没开覆盖率 ✓。
        #   ⇒ 现改成**单行 run** ✓；一切说明文字留在**YAML 注释**里（就是本段 ✓）。
        #
        # 门槛口径（保留历史，供下次调数字时对照 ✓）：
        #   · v2.9.6 起设门槛（54）✓；v2.9.55 → 55 ✓；v2.9.88 → 56 ✓；v2.10.17 → 60 ✓
        #   · **v2.10.19 → 61** ✓ —— 依据：闸门修好后**第一次读到 CI 自己的数字**
        #     `TOTAL 18996 7363 61.24%`（1543 passed / 4 skipped ✓）⇒ 按口径取整 = **61** ✓。
        #   · 规则：**门槛 = 实测值向下取整** ✓，且优先用 **CI 实测** ✓（本地 61.50 / CI 61.24 ✓
        #     —— 两者差 0.26pp ✓，说明过去"CI 略高"的说法**不总成立** ✗ ⇒ 只认 CI 数 ✓）；
        #   · 改这个数字必须同时写进 `md/change_log.md` ✓（否则下一个人不知道为什么是 61 ✗）；
        #   · 若 CPython/依赖版本变化导致掉点，先看日志里的 `TOTAL` ✓（现在会真的打印 ✓）再决定调不调 ✓。
        run: python -m pytest tests -m "not datareq" -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=62

      - name: ruff 静态检查
        run: python -m ruff check app tests tools

  frontend:
    name: 前端 tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★★ v2.9.40（2026-10-19 ✓）：20 → **22** ✗→✓
          #   为什么：2.9.21 查清 CI（Linux + Node 20）上**只要走 jsdom 就崩** ✗
          #   （`TypeError: ... (reading 'bind')` ✓、0 个用例被收集 ✓），而本地
          #   **Node 24** 正常 ✓ ⇒ 高度怀疑 Node 版本与 jsdom 30 不兼容 ✗。
          #   ⇒ 升到 **22（LTS）** ✓，并用 `src/__tests__/dom_probe.test.tsx`（逐文件开 jsdom ✓）
          #     当探针验证 ✓ —— 探针绿 = jsdom 可用 = 可以开始写**交互级**组件测试 ✓。
          #   ⚠ 若探针仍红 ✗：说明光升 Node 不够 ⇒ 钉 jsdom 版本或换 `happy-dom` ✓
          #     （**不要**再动全局 `environment` ✗ —— 它是 `node`，纯函数用例跑得更快 ✓）。
          node-version: 22

      - name: 安装依赖
        # ★★ v2.9.19（2026-10-18 ✓）：`npm ci` → `npm install --legacy-peer-deps` ✗→✓
        #   为什么必须改：CI 从 2.9.17 起**一直是红的** ✗ —— 报的是 npm 的**用法错误**
        #   （`npm error Usage: npm ci` + 一大串 options ✓），真因是：
        #     · 本仓库的 lockfile 是带 `--legacy-peer-deps` 生成的 ✓
        #       （`@testing-library/react@16` 对 React 有 peer 声明 ✗，不加就 ERESOLVE ✓）；
        #     · 而 `npm ci` 会**重新校验 peer** ✗ ⇒ 直接 `EUSAGE` 退出 ✓。
        #   代价：不再"严格复现 lockfile"✗ —— 但换来确定性（与本地同一套 flag ✓）✓。
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npx tsc --noEmit -p tsconfig.json

      # ★ v2.9.17（2026-10-18 ✓）：**前端单测**接进 CI ✓
      #   首个用例集 = `sftLogic`（结论判定 / 预测周期解析 / K 档 / 导出表头 ✓ 11 条 ✓）。
      #   ⚠ vitest 版本要跟着 vite 走 ✗：项目 vite 5 ⇒ **vitest 2.1.x** ✓（5.x 会报
      #     `ERR_PACKAGE_PATH_NOT_EXPORTED ./module-runner` ✓，实测过 ✓）。
      - name: 前端单测 + 覆盖率（vitest）
        # ★ v2.10.23（2026-10-20 ✓）：`npm test` → `npm run test:cov` ✗→✓
        #   前端 181 条用例此前**完全不知道覆盖了哪些组件** ✗（后端有 61.83% + 门槛 ✓，
        #   前端是最后一块黑箱 ✓）⇒ 现在**采集并打印** ✓。
        # ⚠ 本轮**不设门槛** ✓（先拿真实数字 ✓，下一版按"实测值向下取整"设 thresholds ✓）——
        #   凭感觉设一个数，闸门要么一上线就红 ✗、要么松到没意义 ✗。
        run: npm run test:cov

  # ★ v2.10.5（2026-10-20 ✓）：三件事里的第 ③ 件 —— **E2E 冒烟骨架** ✓
  #
  # 为什么单开一个 job ✗→✓：
  #   · 要下 Chromium（`playwright install --with-deps` 约 1~2 分钟 ✓）✗ 不该拖慢单测 job ✓；
  #   · E2E 天生比单测**慢且更易受环境影响** ✓ ⇒ 单独失败时一眼看得出是"集成层"而不是"逻辑层" ✓。
  #
  # 断言范围（写在 `frontend/e2e/smoke.spec.ts` 文件头 ✓）：
  #   真实浏览器跑通整棵 React 树 ✓ + **零未捕获异常** ✓ + 顶栏版本号 ✓；
  #   ⚠ **不做**"提交回测 → 等结果"那条全链路 ✗（需要真后端 + 真数据 + 分钟级等待 ✓，下一轮 ✓）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        # 与 frontend job 同一套 flag ✓（否则 peer 依赖会让 lockfile 与安装结果不一致 ✗）
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 安装 Chromium（仅 chromium ✓，不下 firefox/webkit ✗）
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E 冒烟
        working-directory: frontend
        run: npm run test:e2e

      - name: 失败时上传 trace / 截图（只有失败才有 ✓）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
