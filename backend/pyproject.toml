# ruff 静态检查配置（提交 gate 用）。
# 规则保持保守：E9（语法级错误）+ 未定义名/重定义（F821/F811/F823），
# 不做样式/未用 import 强约束（项目存在依赖"导入副作用"的外挂模块，避免误删）。
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["__pycache__", "workdir"]

[tool.ruff.lint]
select = ["E9", "F821", "F811", "F823"]

# ---------------------------------------------------------------------------
# pytest / 覆盖率（★ v2.9.6，2026-10-18 ✓ P0-A「先有尺子」✓）
#
# 背景：此前**没有覆盖率度量** ✗ ⇒ "测试够不够"只能靠感觉 ✓；加 `--cov` 后：
#   · 基线（2026-10-18 实测）= **53.42%**（18,098 语句 / 覆盖 9,668 ✓，966 用例 ✓）；
#   · CI 用 `--cov-fail-under` 卡住**不许倒退** ✓，每期往上调（ratchet ✓）：
#       53（2.9.6）→ 目标 75+（P1 拆完路由与前端断言后 ✓）。
# ⚠ `markers` 必须声明 ✓ —— 否则每个 datareq 用例都会报 `PytestUnknownMarkWarning` ✗。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "datareq: 需要本地行情/物化数据的用例（CI 无数据 ⇒ 用 -m 'not datareq' 跳过 ✓）",
]

[tool.coverage.run]
source = ["app"]
# `patches/` 是 qlib 运行时补丁（导入即生效、没有可测分支 ✓）⇒ 排除，避免虚低 ✗
omit = ["app/engine/patches/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
precision = 2

# ---------------------------------------------------------------------------
# mypy（★ v2.10.4，2026-10-20）—— 第二件事「类型检查」的第一道闸 ✓
#
# ⚠ **只对关键切片开**（不是全量 108 个文件 ✗）：一次性给整个 `app/` 加注解是
#   "重写一遍"级别的工程 ✓；先拿语义最集中的三处（数据模型 / 配置 / 指标汇总 ✓），
#   等这批稳定 0 错误后，再按"**只增不减**"的棘轮思路往周边扩 ✓。
#
# ⚠ 必须启用 **`pydantic.mypy` 插件** ✗→✓：不启用时，mypy 会把每个 `Field(...)`
#   当成"必填参数" ✓ ⇒ `BacktestResult()` 会报 12 条 `Missing named argument` ✗
#   （这类假阳性会把闸门变成噪声 ✓，最后被人关掉 ✗）。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# ★ v2.10.6（2026-10-20）：**扩一圈** ✓ —— 加上本轮逐个修干净的 5 个文件 ✓
#   ⚠ **必须 `follow_imports = "silent"`** ✗→✓：不加时 mypy 会顺着 import 检查**整张依赖图**
#   （实测 6 个文件 → **105 条** ✗，其中大部分属于 `factors/` 分支 ✓）⇒ 闸门第一天就变成噪声 ✓；
#   加了之后只报**这里列出的文件** ✓（同一批 6 个文件 → **15 条** ✓，逐条可修 ✓）。
#
# ⚠ **`engine/charts.py` 故意先不收** ✗：它有 6 条 `arg-type`，全是 matplotlib 对
#   `list[Any | None]`（日期列表里可能有 `None` ✓）的严格签名 ✓ —— 要修就得改绘图数据流 ✓
#   （收益低、风险高 ✓）。等哪天图表要重写时一起处理 ✓。
files = [
    "app/models",
    "app/config.py",
    "app/engine/metrics.py",
    "app/engine/analysis.py",
    "app/engine/artifacts.py",
    "app/engine/inst_mask.py",
    "app/signals/engine.py",
    "app/signals/pricing.py",
    # ★ v2.10.10（2026-10-20）：公式翻译器里的**两个纯解析文件** ✓
    "app/factors/parser/lexer.py",
    "app/factors/parser/parser.py",
    # ★ v2.10.14（2026-10-20）：`services/` 与 `datasource/` 的一圈 ✓（12 → 17 个文件 ✓）
    "app/factors/benchmark_curves.py",
    # ★ v2.10.45（2026-10-21）：`engine/signal_compose.py` ✓ —— **这条是"补漏"而不是"扩展"** ✗→✓：
    #   它里面 `_daily_series(None, score.index, [...])` 多传一个参数 ✗ ⇒
    #   **只要用户配了市值/股价硬过滤就 TypeError** ✓（该功能从没跑通过 ✓）。
    #   那类错本轮是**临时跑一次 mypy 才发现的** ✓ ⇒ 收进闸门，以后**每次 CI 都会拦** ✓。
    "app/engine/signal_compose.py",
    "app/services/error_policy.py",
    "app/services/expr_cache.py",
    "app/services/custom_formulas.py",
    "app/datasource/qlib_source.py",
    "app/datasource/tdx_gpcw.py",
    # ⚠ **`app/services/artifacts_service.py` 先不收** ✗：7 条里有两条不是注解问题 ——
    #   `"object" has no attribute "__iter__"` ✓ 与 `Unsupported target for indexed assignment
    #   ("list[str] | dict | str | None")` ✓ ⇒ 都指向**同一坨可变结构在多个分支里被当成不同类型用** ✗，
    #   要先读懂它的数据流（并可能顺手改结构 ✓）才敢动 ✓ —— 单独一轮 ✓，本轮不硬塞 ✗。
    # ★ v2.10.12（2026-10-20）：`semantic.py` **查清后收进来** ✓ ——
    #   原先那 6 条里最可疑的一条（`dict` 上调 `.add()`）已确认是**注解写错、代码是对的** ✓
    #   （`delayed` 一直是 `set` ✓，调用处也传 `set()` ✓ ⇒ 零运行时风险 ✓），其余 5 条纯属
    #   "空容器没标元素类型" ✓ ⇒ 全部**只改注解** ✓，一行行为没动 ✓。
    "app/factors/parser/semantic.py",
    # ★ v2.10.81（2026-10-21）：**一次扩 17 个模块** ✓ —— 覆盖面 18 → 35 条（模块 ≈ 37% ✓）。
    #   做法不是"先加进去再修"✗，而是**先批量跑 mypy 探明哪些本来就零错误** ✓
    #   （19 个候选里 **14 个是零错误** ✓ ⇒ 直接收 ✓），再修剩下 3 个单错误的：
    #   · `board_exchange`：属性 `= None` 让 mypy 推成 `None` 类型 ⇒ **显式标注** ✓；
    #   · `chip_dist.chip_run`：`prices` 签名写窄了 ✗（实际收**数组列表**）⇒ 改 `Sequence[ndarray]` ✓；
    #   · `market_stat`：`specs[0].formula` 是 `str | None` ⇒ **先收窄再调用** ✓（行为不变 ✓）。
    #   ⚠ 剩下 `storage_cleanup`(7 条) / `artifacts_service`(7 条) **没收** ✗ ——
    #     它们要读数据流才能修对 ✓（硬加注解只会掩盖真问题 ✗），留给下一轮 ✓。
    "app/engine/code_fp.py",
    "app/engine/context.py",
    "app/engine/utils.py",
    "app/engine/resource.py",
    "app/engine/board_exchange.py",
    "app/engine/data_cache.py",
    "app/engine/feature_cache.py",
    "app/engine/periodic_strategy.py",
    "app/factors/seg_ops.py",
    "app/factors/chip_turn.py",
    "app/factors/chip_store.py",
    "app/factors/market_stat.py",
    "app/signals/codes.py",
    "app/signals/event.py",
    "app/services/datasets.py",
    "app/services/formula_git_sync.py",
    "app/services/qlib_runtime.py",
]
follow_imports = "silent"
# 只报"能修且值得修"的：`--strict` 会把 `Any` 泛滥全暴露出来 ✗（另有专门回合 ✓）
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
