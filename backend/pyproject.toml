# ruff 静态检查配置（提交 gate 用）。
# 规则保持保守：E9（语法级错误）+ 未定义名/重定义（F821/F811/F823），
# 不做样式/未用 import 强约束（项目存在依赖"导入副作用"的外挂模块，避免误删）。
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["__pycache__", "workdir"]

[tool.ruff.lint]
# ★ v2.11.50：加了 **`I001`（import 未排序）+ `W291`（行尾空白）** ✓
#   为什么只加这两条、**不加 `ruff format`** ✗ —— 实测（2026-10-23）：
#   `ruff format` 会重排 **307 个文件**，且**把所有长行拆多行** ⇒
#   `panel_expr` 2598→2687（超 2600 ✗）、`run_single_factor_tests` 539→576 ✗、
#   `run` 501→572 ✗、`run_batch_backtest` 297→**338**（刚下线的又涨回 300+ ✗）
#   ⇒ **与 `test_code_health` 的"行数只减不增"棘轮直接冲突** ✗。
#   而 `I001`/`W291` 是**纯重排/删空白** ✓ —— 实测**函数行数全部 +0** ✓（棘轮安全 ✓）。
# ★ v2.11.56：加了 bugbear 的**三条** ✓ —— 只挑"少而真"的（先量噪声再开 ✗）：
#   · `B006` 可变默认参数（**1 处**，实测是 `FormulaHandler.infer_processors=[]` ✗
#     ⇒ 所有实例共享同一个 list ⇒ 谁 append 一次就污染后续实例 ✓，只在"跑两次"时暴露 ✗）；
#   · `B010` 用常量调 `setattr`（1 处，可自动修 ✓）；
#   · `B007` 循环变量未使用（20 处，机械改名 `_` ✓）。
#   ⚠ **没开**的三条（都量过，噪声太大 ✗）：
#     `B023` function-uses-loop-variable **56** 处（最有价值但需逐个判定闭包绑定 ✗，留待专门一轮）；
#     `B904` raise-without-from **43** 处（会改异常链/traceback ✗，需人判断）；
#     `B905` zip-without-strict **38** 处（要逐处确认两序列等长 ✓，误开会引入新异常 ✗）。
#   · `B017`（v2.11.61 ✓）：`pytest.raises(Exception)` 太宽 ✗ —— 等于"只要炸了就算对" ✓，
#     连 `TypeError` 这种**实现 bug** 也会被当成预期 ✓（本项目只 1 处，已收窄到
#     `(ValueError, IndexError)` ✓，实测那 6 个坏输入就抛这两种 ✓）。
select = ["E9", "F821", "F811", "F823", "I001", "W291", "B006", "B007", "B010", "B017"]

# ---------------------------------------------------------------------------
# pytest / 覆盖率（★ v2.9.6，2026-10-18 ✓ P0-A「先有尺子」✓）
#
# 背景：此前**没有覆盖率度量** ✗ ⇒ "测试够不够"只能靠感觉 ✓；加 `--cov` 后：
#   · 基线（2026-10-18 实测）= **53.42%**（18,098 语句 / 覆盖 9,668 ✓，966 用例 ✓）；
#   · CI 用 `--cov-fail-under` 卡住**不许倒退** ✓，每期往上调（ratchet ✓）：
#       53（2.9.6）→ 目标 75+（P1 拆完路由与前端断言后 ✓）。
# ⚠ `markers` 必须声明 ✓ —— 否则每个 datareq 用例都会报 `PytestUnknownMarkWarning` ✗。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "datareq: 需要本地行情/物化数据的用例（CI 无数据 ⇒ 用 -m 'not datareq' 跳过 ✓）",
    # ★ v2.11.60：**绝对耗时**用例单独一类 ✓ —— 必须**隔离串行**跑，
    #   与 1900 条用例交错会被负载污染 ✗（实测某条量到 7.52s、上限 7.59s ⇒ 只差 0.07s ✓）。
    "perf: 有绝对耗时阈值的用例（CI 单独串行跑 ✓ 别和全量混跑 ✗）",
    ]

[tool.coverage.run]
source = ["app"]
# `patches/` 是 qlib 运行时补丁（导入即生效、没有可测分支 ✓）⇒ 排除，避免虚低 ✗
omit = ["app/engine/patches/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
precision = 2

# ---------------------------------------------------------------------------
# mypy（★ v2.10.4，2026-10-20）—— 第二件事「类型检查」的第一道闸 ✓
#
# ⚠ **只对关键切片开**（不是全量 108 个文件 ✗）：一次性给整个 `app/` 加注解是
#   "重写一遍"级别的工程 ✓；先拿语义最集中的三处（数据模型 / 配置 / 指标汇总 ✓），
#   等这批稳定 0 错误后，再按"**只增不减**"的棘轮思路往周边扩 ✓。
#
# ⚠ 必须启用 **`pydantic.mypy` 插件** ✗→✓：不启用时，mypy 会把每个 `Field(...)`
#   当成"必填参数" ✓ ⇒ `BacktestResult()` 会报 12 条 `Missing named argument` ✗
#   （这类假阳性会把闸门变成噪声 ✓，最后被人关掉 ✗）。
# ---------------------------------------------------------------------------
# ★ v2.11.27（技术债"无 SAST"清偿 ✓）：bandit 只跑**中/高危**（`-ll` ✓）
#   ⚠ 跳过 `B301`（pickle）—— 本项目的 pickle **只用于自家缓存文件** ✓：
#     `engine/feature_cache.py` / `factors/event_study_cache.py` / `engine/artifacts.py` ✓
#     路径都来自 `config.WORK_DIR` 下的固定子目录 ✓，**从不反序列化用户上传的内容** ✓
#     （用户上传的是 CSV/Excel ✓，走 `signals/parsers/` ✓，不碰 pickle ✓）。
#   ⚠ 但**跳过不等于不重要** ✓：哪天真的 pickle 了外部/用户数据 ⇒ 必须回来删掉这个 skip ✓
#     （所以原因写在这里，而不是塞一个 `# nosec` 到 9 个调用点 ✗ —— 分散的原因没人会读到 ✓）。
#   `B324`（md5）**没有跳过** ✓：9 处全部显式加了 `usedforsecurity=False` ✓
#     （都是缓存键/指纹 ✓，声明意图比跳过规则好 ✓，也兼容 FIPS 环境 ✓）。
[tool.bandit]
skips = ["B301"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# ★ v2.10.6（2026-10-20）：**扩一圈** ✓ —— 加上本轮逐个修干净的 5 个文件 ✓
#   ⚠ **必须 `follow_imports = "silent"`** ✗→✓：不加时 mypy 会顺着 import 检查**整张依赖图**
#   （实测 6 个文件 → **105 条** ✗，其中大部分属于 `factors/` 分支 ✓）⇒ 闸门第一天就变成噪声 ✓；
#   加了之后只报**这里列出的文件** ✓（同一批 6 个文件 → **15 条** ✓，逐条可修 ✓）。
#
# ⚠ **`engine/charts.py` 故意先不收** ✗：它有 6 条 `arg-type`，全是 matplotlib 对
#   `list[Any | None]`（日期列表里可能有 `None` ✓）的严格签名 ✓ —— 要修就得改绘图数据流 ✓
#   （收益低、风险高 ✓）。等哪天图表要重写时一起处理 ✓。
# ★★ v2.11.39：**整包纳入**（原来是逐文件白名单）——
#   探针确认『未进闸门的模块 0 个有错』后才敢这么改（见该版本 change_log）。
#   ⚠ 以后新增模块**默认就在闸门里** ⇒ 不会再出现『新代码悄悄没有类型检查』。
files = ["app"]
follow_imports = "silent"
# 只报"能修且值得修"的：`--strict` 会把 `Any` 泛滥全暴露出来 ✗（另有专门回合 ✓）
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
